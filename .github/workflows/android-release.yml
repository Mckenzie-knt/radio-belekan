name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Autorise le GITHUB_TOKEN a commiter la cle d'upload chiffree dans le repo
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.5.1 exige Node >= 22
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK deja preinstalle sur les runners ubuntu-latest

      - name: Install dependencies
        run: |
          set -o pipefail
          if ! npm install 2>&1 | tee install.log; then
            echo "=== npm install a echoue, sauvegarde du log sur la branche ci-debug ==="
            git config user.name "ci-debug"
            git config user.email "ci-debug@users.noreply.github.com"
            mkdir -p debug
            cp install.log debug/install-failure.txt
            git add -f debug/install-failure.txt
            git commit -m "ci-debug: log d'echec npm install (run ${{ github.run_id }})"
            git push origin HEAD:refs/heads/ci-debug --force || true
            exit 1
          fi

      - name: Build web app (Vite)
        run: npm run build
        env:
          # Cles publiques (anon) Supabase, embarquees dans le bundle par conception
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'nvhmllceypaezrlnurvo' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://nvhmllceypaezrlnurvo.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52aG1sbGNleXBhZXpybG51cnZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzQxMzcsImV4cCI6MjA4ODU1MDEzN30.l8I3vq6iD0HGz5B4jKNc78uS17fjcNPhqkmSfNv-94k' }}

      - name: Add and sync Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Prepare upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : secret KEYSTORE_PASSWORD manquant (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -f android-signing/upload-key.jks.enc ]; then
            echo "Dechiffrement de la cle d'upload existante"
            openssl enc -d -aes-256-cbc -pbkdf2 -in android-signing/upload-key.jks.enc -out upload-key.jks -pass pass:"$KEYSTORE_PASSWORD"
          else
            echo "Generation d'une nouvelle cle d'upload (premiere fois)"
            keytool -genkeypair -v -keystore upload-key.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Radio Belekan de Kati, O=Radio Belekan, L=Kati, C=ML"
            mkdir -p android-signing
            openssl enc -e -aes-256-cbc -pbkdf2 -in upload-key.jks -out android-signing/upload-key.jks.enc -pass pass:"$KEYSTORE_PASSWORD"
            git config user.name "ci-signing"
            git config user.email "ci-signing@users.noreply.github.com"
            git add android-signing/upload-key.jks.enc
            git commit -m "ci: add encrypted upload signing key (Play App Signing upload key)"
            git push origin HEAD:refs/heads/main
          fi

      - name: Build release AAB
        run: |
          cd android
          chmod +x gradlew
          # versionCode unique par run pour Play Store
          sed -i -E "s/versionCode 1[[:space:]]*$/versionCode ${{ github.run_number }}/" app/build.gradle 2>/dev/null || true
          sed -i -E "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle 2>/dev/null || true
          sed -i -E "s/versionName 1.0/versionName 1.0.${{ github.run_number }}/" app/build.gradle 2>/dev/null || true
          sed -i -E "s/versionCode = 1[[:space:]]*$/versionCode = ${{ github.run_number }}/" app/build.gradle 2>/dev/null || true
          ./gradlew bundleRelease

      - name: Sign AAB (upload key)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore upload-key.jks -storepass "$KEYSTORE_PASSWORD" "$AAB" upload
          jarsigner -verify "$AAB" && echo "AAB signe avec succes"

      - name: Build and sign APK (installation directe / test local)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | head -1)
          "$APKSIGNER" sign --ks ../upload-key.jks --ks-pass "pass:$KEYSTORE_PASSWORD" app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/radio-belekan.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-belekan-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK artifact (test local)
        uses: actions/upload-artifact@v4
        with:
          name: radio-belekan-apk
          path: android/app/build/outputs/apk/release/radio-belekan.apk
          retention-days: 30
